[project]
name = "mat-trener-tools"
version = "0.1.0"
description = "Local import and validation tools for Mat-Trener"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.10"]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

